name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, Lint, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Verify toolchain
        run: bun run check:toolchain

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Hygiene checks
        run: bun run checks:hygiene

      - name: Check formatting
        run: bun run checks:fmt:ci

      - name: Lint
        run: bun run checks:lint:ci

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
