name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Toolchain, Hygiene, Format, Lint, Build)
    uses: schnau-dev/.github/.github/workflows/reusable-bun-ci.yml@main
    with:
      runs-on: '["self-hosted","Linux","ARM64","nixos","vps"]'
      timeout-minutes: 8
      working-directory: "."
      require-npm-token: true
      pre-command: bun scripts/check-toolchain.ts
      command: |
        bun scripts/check-hygiene.ts

        if [ "${RUNNER_ARCH}" = "ARM64" ]; then
          nix run nixpkgs#oxfmt -- --check .
        else
          bun run checks:fmt:ci
        fi

        bun run --filter '@groundswell/zod-helpers' build
        bun run --filter '@groundswell/core' build
        bun run --filter '@groundswell/core-server' build
        bun run --filter '@groundswell/react' build
        bun run --filter '@groundswell/adapter-sse-client' build
        bun run --filter '@groundswell/adapter-hono-server' build
        bun run --filter '@groundswell/adapter-bun-server' build
        bun run --filter '@groundswell/adapter-drizzle-sqlite' build
        bun run --filter '@groundswell/adapter-drizzle-postgres' build

        bun run checks:lint:ci
    secrets: inherit

  test-unit-integration:
    name: Unit + Integration (Coverage)
    needs: quality
    uses: schnau-dev/.github/.github/workflows/reusable-bun-ci.yml@main
    with:
      runs-on: '["self-hosted","Linux","ARM64","nixos","vps"]'
      timeout-minutes: 10
      working-directory: "."
      require-npm-token: true
      install-node: true
      pre-command: |
        bun scripts/check-toolchain.ts

        bun run --filter '@groundswell/zod-helpers' build
        bun run --filter '@groundswell/core' build
        bun run --filter '@groundswell/core-server' build
        bun run --filter '@groundswell/react' build
        bun run --filter '@groundswell/adapter-sse-client' build
        bun run --filter '@groundswell/adapter-hono-server' build
        bun run --filter '@groundswell/adapter-bun-server' build
        bun run --filter '@groundswell/adapter-drizzle-sqlite' build
        bun run --filter '@groundswell/adapter-drizzle-postgres' build
      command: node ./node_modules/vitest/vitest.mjs run --coverage
      artifact1_name: coverage-report
      artifact1_path: |
        coverage/**
        ./**/coverage/**
    secrets: inherit

  test-postgres-integration:
    name: Postgres Integration (adapter-drizzle-postgres)
    needs: quality
    uses: schnau-dev/.github/.github/workflows/reusable-bun-ci.yml@main
    with:
      runs-on: '["self-hosted","Linux","ARM64","nixos","vps"]'
      timeout-minutes: 10
      working-directory: "."
      require-npm-token: true
      pre-command: |
        if command -v docker >/dev/null 2>&1; then
          CONTAINER_RUNTIME="docker"
          echo "CONTAINER_RUNTIME=docker" >> "$GITHUB_ENV"
        else
          if ! command -v podman >/dev/null 2>&1; then
            nix profile install --accept-flake-config nixpkgs#podman
            echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
          fi

          if command -v podman >/dev/null 2>&1; then
            CONTAINER_RUNTIME="podman"
            echo "CONTAINER_RUNTIME=podman" >> "$GITHUB_ENV"
          else
            echo "::error::No supported container runtime found (docker or podman)."
            exit 1
          fi
        fi

        CONTAINER_NAME="groundswell-postgres-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        echo "POSTGRES_CONTAINER_NAME=${CONTAINER_NAME}" >> "$GITHUB_ENV"
        "${CONTAINER_RUNTIME}" rm -f "${CONTAINER_NAME}" >/dev/null 2>&1 || true
        "${CONTAINER_RUNTIME}" run -d \
          --name "${CONTAINER_NAME}" \
          -e POSTGRES_USER=groundswell \
          -e POSTGRES_PASSWORD=groundswell \
          -e POSTGRES_DB=groundswell_test \
          -p 127.0.0.1::5432 \
          postgres:16-alpine

        POSTGRES_HOST_PORT="$(
          "${CONTAINER_RUNTIME}" port "${CONTAINER_NAME}" 5432/tcp \
            | sed -E 's/.*:([0-9]+)$/\1/' \
            | head -n 1
        )"
        if [ -z "${POSTGRES_HOST_PORT}" ]; then
          "${CONTAINER_RUNTIME}" logs "${CONTAINER_NAME}" || true
          echo "::error::Could not determine mapped host port for postgres container."
          exit 1
        fi
        echo "POSTGRES_HOST_PORT=${POSTGRES_HOST_PORT}" >> "$GITHUB_ENV"

        POSTGRES_READY="false"
        for _ in $(seq 1 45); do
          if "${CONTAINER_RUNTIME}" exec "${CONTAINER_NAME}" pg_isready -U groundswell -d postgres >/dev/null 2>&1 \
            && "${CONTAINER_RUNTIME}" exec "${CONTAINER_NAME}" psql -U groundswell -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'groundswell_test';" | grep -q '^1$'; then
            POSTGRES_READY="true"
            break
          fi
          sleep 2
        done

        if [ "${POSTGRES_READY}" != "true" ]; then
          "${CONTAINER_RUNTIME}" logs "${CONTAINER_NAME}" || true
          echo "::error::Postgres container failed readiness checks (server unavailable or groundswell_test missing)."
          exit 1
        fi

        bun scripts/check-toolchain.ts

        bun run --filter '@groundswell/zod-helpers' build
        bun run --filter '@groundswell/core' build
        bun run --filter '@groundswell/core-server' build
        bun run --filter '@groundswell/adapter-drizzle-postgres' build
      command: GROUNDSWELL_TEST_POSTGRES_URL="postgres://groundswell:groundswell@127.0.0.1:${POSTGRES_HOST_PORT}/groundswell_test" bun run test:postgres:integration
      post-command: |
        if [ -n "${CONTAINER_RUNTIME:-}" ] && [ -n "${POSTGRES_CONTAINER_NAME:-}" ]; then
          "${CONTAINER_RUNTIME}" rm -f "${POSTGRES_CONTAINER_NAME}" >/dev/null 2>&1 || true
        fi
    secrets: inherit

  test-e2e:
    name: E2E (Playwright)
    needs: quality
    uses: schnau-dev/.github/.github/workflows/reusable-bun-ci.yml@main
    with:
      runs-on: '["self-hosted","Linux","ARM64","nixos","vps"]'
      timeout-minutes: 10
      working-directory: "."
      require-npm-token: true
      install-node: true
      install-playwright: true
      playwright-browser: chromium
      pre-command: |
        bun scripts/check-toolchain.ts

        bun run --filter '@groundswell/zod-helpers' build
        bun run --filter '@groundswell/core' build
        bun run --filter '@groundswell/core-server' build
        bun run --filter '@groundswell/react' build
        bun run --filter '@groundswell/adapter-sse-client' build
        bun run --filter '@groundswell/adapter-bun-server' build
        bun run --filter '@groundswell/adapter-drizzle-sqlite' build

        E2E_PORT="$(
          node -e "const net = require('node:net'); const server = net.createServer(); server.listen(0, '127.0.0.1', () => { const address = server.address(); console.log(typeof address === 'object' ? address.port : ''); server.close(); });"
        )"
        if [ -z "${E2E_PORT}" ]; then
          echo "::error::Could not determine a free E2E port."
          exit 1
        fi
        echo "GROUNDSWELL_E2E_PORT=${E2E_PORT}" >> "$GITHUB_ENV"
      command: GROUNDSWELL_E2E_PORT="${GROUNDSWELL_E2E_PORT}" node ./node_modules/playwright/cli.js test
      artifact1_name: playwright-report
      artifact1_path: playwright-report
      artifact2_name: playwright-test-results
      artifact2_path: test-results/playwright
    secrets: inherit
