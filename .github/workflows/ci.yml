name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  npm_token: ${{ secrets.NPM_TOKEN }}

jobs:
  quality:
    name: Quality (Toolchain, Hygiene, Format, Lint, Build)
    runs-on: [self-hosted, Linux, ARM64, nixos, vps]
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun (Nix)
        run: |
          nix profile install --accept-flake-config nixpkgs#bun
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: Verify private registry auth
        run: |
          if [ -z "${npm_token}" ]; then
            echo "::error::Missing required repository secret NPM_TOKEN (used as npm_token for bunfig.toml)."
            exit 1
          fi

      - name: Verify toolchain
        run: bun run check:toolchain

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Hygiene checks
        run: bun run checks:hygiene

      - name: Check formatting
        run: |
          if [ "${RUNNER_ARCH}" = "ARM64" ]; then
            nix run nixpkgs#oxfmt -- --check .
          else
            bun run checks:fmt:ci
          fi

      - name: Build
        run: |
          BUN="$HOME/.nix-profile/bin/bun"
          if [ ! -x "$BUN" ]; then
            BUN="$(command -v bun)"
          fi
          "$BUN" run --filter '@groundswell/zod-helpers' build
          "$BUN" run --filter '@groundswell/core' build
          "$BUN" run --filter '@groundswell/core-server' build
          "$BUN" run --filter '@groundswell/react' build
          "$BUN" run --filter '@groundswell/adapter-sse-client' build
          "$BUN" run --filter '@groundswell/adapter-hono-server' build
          "$BUN" run --filter '@groundswell/adapter-bun-server' build
          "$BUN" run --filter '@groundswell/adapter-drizzle-sqlite' build
          "$BUN" run --filter '@groundswell/adapter-drizzle-postgres' build

      - name: Lint
        run: |
          bun run checks:lint:ci

  test-unit-integration:
    name: Unit + Integration (Coverage)
    runs-on: [self-hosted, Linux, ARM64, nixos, vps]
    timeout-minutes: 10
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun (Nix)
        run: |
          nix profile install --accept-flake-config nixpkgs#bun
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: Setup Node (Nix)
        run: |
          nix profile install --accept-flake-config nixpkgs#nodejs_22
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: bun run check:toolchain

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build workspace packages for Node-based test resolution
        run: |
          BUN="$HOME/.nix-profile/bin/bun"
          if [ ! -x "$BUN" ]; then
            BUN="$(command -v bun)"
          fi
          "$BUN" run --filter '@groundswell/zod-helpers' build
          "$BUN" run --filter '@groundswell/core' build
          "$BUN" run --filter '@groundswell/core-server' build
          "$BUN" run --filter '@groundswell/react' build
          "$BUN" run --filter '@groundswell/adapter-sse-client' build
          "$BUN" run --filter '@groundswell/adapter-hono-server' build
          "$BUN" run --filter '@groundswell/adapter-bun-server' build
          "$BUN" run --filter '@groundswell/adapter-drizzle-sqlite' build
          "$BUN" run --filter '@groundswell/adapter-drizzle-postgres' build

      - name: Run tests with coverage
        run: node ./node_modules/vitest/vitest.mjs run --coverage

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/**
            ./**/coverage/**
          if-no-files-found: ignore

  test-postgres-integration:
    name: Postgres Integration (adapter-drizzle-postgres)
    runs-on: [self-hosted, Linux, ARM64, nixos, vps]
    timeout-minutes: 10
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select container runtime
        run: |
          if command -v docker >/dev/null 2>&1; then
            echo "CONTAINER_RUNTIME=docker" >> "$GITHUB_ENV"
            exit 0
          fi

          if ! command -v podman >/dev/null 2>&1; then
            nix profile install --accept-flake-config nixpkgs#podman
            echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
          fi

          if command -v podman >/dev/null 2>&1; then
            echo "CONTAINER_RUNTIME=podman" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "::error::No supported container runtime found (docker or podman)."
          exit 1

      - name: Start Postgres test container
        run: |
          "${CONTAINER_RUNTIME}" rm -f groundswell-postgres-test >/dev/null 2>&1 || true
          "${CONTAINER_RUNTIME}" run -d \
            --name groundswell-postgres-test \
            -e POSTGRES_USER=groundswell \
            -e POSTGRES_PASSWORD=groundswell \
            -e POSTGRES_DB=groundswell_test \
            -p 5432:5432 \
            postgres:16-alpine

          for i in $(seq 1 30); do
            if "${CONTAINER_RUNTIME}" exec groundswell-postgres-test pg_isready -U groundswell -d groundswell_test >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done

          "${CONTAINER_RUNTIME}" logs groundswell-postgres-test
          echo "::error::Postgres container failed to become healthy in time."
          exit 1

      - name: Setup Bun (Nix)
        run: |
          nix profile install --accept-flake-config nixpkgs#bun
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: bun run check:toolchain

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run Postgres integration suite
        env:
          GROUNDSWELL_TEST_POSTGRES_URL: postgres://groundswell:groundswell@127.0.0.1:5432/groundswell_test
        run: bun run test:postgres:integration

      - name: Stop Postgres test container
        if: always()
        run: |
          if [ -n "${CONTAINER_RUNTIME}" ]; then
            "${CONTAINER_RUNTIME}" rm -f groundswell-postgres-test >/dev/null 2>&1 || true
          fi

  test-e2e:
    name: E2E (Playwright)
    runs-on: [self-hosted, Linux, ARM64, nixos, vps]
    timeout-minutes: 10
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun (Nix)
        run: |
          nix profile install --accept-flake-config nixpkgs#bun
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: Setup Node (Nix)
        run: |
          nix profile install --accept-flake-config nixpkgs#nodejs_22
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: bun run check:toolchain

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browser
        run: node ./node_modules/playwright/cli.js install chromium

      - name: Run E2E suite
        run: node ./node_modules/playwright/cli.js test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright traces/videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/playwright
          if-no-files-found: ignore
