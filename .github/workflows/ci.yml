name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Toolchain, Hygiene, Format, Lint, Build)
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Verify toolchain
        run: bun run check:toolchain

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Hygiene checks
        run: bun run checks:hygiene

      - name: Check formatting
        run: bun run checks:fmt:ci

      - name: Lint
        run: bun run checks:lint:ci

      - name: Build
        run: bun run build

  test-unit-integration:
    name: Unit + Integration (Coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Verify toolchain
        run: bun run check:toolchain

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: bun run test:coverage

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/**
            ./**/coverage/**
          if-no-files-found: ignore

  test-postgres-integration:
    name: Postgres Integration (adapter-drizzle-postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: groundswell
          POSTGRES_PASSWORD: groundswell
          POSTGRES_DB: groundswell_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U groundswell -d groundswell_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Verify toolchain
        run: bun run check:toolchain

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Postgres integration suite
        env:
          GROUNDSWELL_TEST_POSTGRES_URL: postgres://groundswell:groundswell@127.0.0.1:5432/groundswell_test
        run: bun run test:postgres:integration

  test-e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Verify toolchain
        run: bun run check:toolchain

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run E2E suite
        run: bun run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright traces/videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/playwright
          if-no-files-found: ignore
