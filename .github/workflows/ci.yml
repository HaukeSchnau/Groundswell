name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  npm_token: ${{ secrets.NPM_TOKEN }}

jobs:
  quality:
    name: Quality (Toolchain, Hygiene, Format, Lint, Build)
    runs-on: [self-hosted, Linux, ARM64, nixos, vps]
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun (Nix)
        run: |
          nix profile install --accept-flake-config nixpkgs#bun
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: Verify private registry auth
        run: |
          if [ -z "${npm_token}" ]; then
            echo "::error::Missing required repository secret NPM_TOKEN (used as npm_token for bunfig.toml)."
            exit 1
          fi

      - name: Verify toolchain
        run: bun run check:toolchain

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Hygiene checks
        run: bun run checks:hygiene

      - name: Check formatting
        run: |
          if [ "${RUNNER_ARCH}" = "ARM64" ]; then
            nix run nixpkgs#oxfmt -- --check .
          else
            bun run checks:fmt:ci
          fi

      - name: Lint
        run: |
          if [ "${RUNNER_ARCH}" = "ARM64" ]; then
            nix shell nixpkgs#oxlint nixpkgs#nodejs-slim --command \
              oxlint --type-aware --type-check --deny-warnings .
          else
            bun run checks:lint:ci
          fi

      - name: Build
        run: bun run build

  test-unit-integration:
    name: Unit + Integration (Coverage)
    runs-on: [self-hosted, Linux, ARM64, nixos, vps]
    timeout-minutes: 10
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun (Nix)
        run: |
          nix profile install --accept-flake-config nixpkgs#bun
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: bun run check:toolchain

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run tests with coverage
        run: bun run test:coverage

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/**
            ./**/coverage/**
          if-no-files-found: ignore

  test-postgres-integration:
    name: Postgres Integration (adapter-drizzle-postgres)
    runs-on: [self-hosted, Linux, ARM64, nixos, vps]
    timeout-minutes: 10
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Postgres test container
        run: |
          podman rm -f groundswell-postgres-test >/dev/null 2>&1 || true
          podman run -d \
            --name groundswell-postgres-test \
            -e POSTGRES_USER=groundswell \
            -e POSTGRES_PASSWORD=groundswell \
            -e POSTGRES_DB=groundswell_test \
            -p 5432:5432 \
            postgres:16-alpine

          for i in $(seq 1 30); do
            if podman exec groundswell-postgres-test pg_isready -U groundswell -d groundswell_test >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done

          podman logs groundswell-postgres-test
          echo "::error::Postgres container failed to become healthy in time."
          exit 1

      - name: Setup Bun (Nix)
        run: |
          nix profile install --accept-flake-config nixpkgs#bun
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: bun run check:toolchain

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run Postgres integration suite
        env:
          GROUNDSWELL_TEST_POSTGRES_URL: postgres://groundswell:groundswell@127.0.0.1:5432/groundswell_test
        run: bun run test:postgres:integration

      - name: Stop Postgres test container
        if: always()
        run: podman rm -f groundswell-postgres-test >/dev/null 2>&1 || true

  test-e2e:
    name: E2E (Playwright)
    runs-on: [self-hosted, Linux, ARM64, nixos, vps]
    timeout-minutes: 10
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun (Nix)
        run: |
          nix profile install --accept-flake-config nixpkgs#bun
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: bun run check:toolchain

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browser
        run: bunx playwright install chromium

      - name: Run E2E suite
        run: bun run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright traces/videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/playwright
          if-no-files-found: ignore
